# Bootstrap config. Certbot can add HTTPS after both DNS records resolve.
# Keep the existing app.elasticlabs.site server block intact.
# http-context include: omit query capabilities and share grants from access logs.
map $uri $freeframe_safe_path {
    default $uri;
    ~^/(api/)?share/ /share/[link];
}
log_format freeframe_safe '$remote_addr "$request_method $freeframe_safe_path $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name reviews.elasticlabs.site;
    access_log /var/log/nginx/freeframe-access.log freeframe_safe;
    client_max_body_size 50m;
    add_header Content-Security-Policy "frame-ancestors https://app.elasticlabs.site" always;

    # Native-only Elastic deployment: Studio owns member login and the workspace.
    # Use a fixed destination; do not forward arbitrary `from`/callback queries.
    # Keep guest shares, API, HLS and their frontend assets on this origin.
    location = / { return 302 https://app.elasticlabs.site/apps/reviews; }
    location = /login { return 302 https://app.elasticlabs.site/apps/reviews; }
    location = /setup { return 302 https://app.elasticlabs.site/apps/reviews; }
    location = /studio { return 302 https://app.elasticlabs.site/apps/reviews; }
    location = /projects { return 302 https://app.elasticlabs.site/apps/reviews; }
    location /projects/ { return 302 https://app.elasticlabs.site/apps/reviews; }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Native Studio resolves FreeFrame's relative HLS URLs on this origin.
    location /stream/hls/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name review-media.elasticlabs.site;
    access_log /var/log/nginx/freeframe-access.log freeframe_safe;
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
