name: elastic-freeframe

# Standalone production stack. The host nginx owns public ports 80/443.
services:
  postgres:
    image: postgres:15-alpine
    env_file: ../../.env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-freeframe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file: ../../.env.prod
    command: >-
      sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_CORS_ALLOW_ORIGIN: ${FRONTEND_URL}
      MINIO_CORS_ALLOW_METHODS: GET,PUT,POST,DELETE,HEAD
      MINIO_CORS_ALLOW_HEADERS: "*"
      MINIO_CORS_EXPOSE_HEADERS: ETag,Content-Length,x-amz-request-id
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9100:9000"
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file: ../../.env.prod
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c 'until mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; do sleep 2; done; mc mb --ignore-existing "local/$${S3_BUCKET}"'
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prod
    env_file: ../../.env.prod
    environment:
      DISABLE_DOCS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >-
      sh -c 'cd /workspace/apps/api && alembic upgrade head && cd /workspace &&
      gunicorn apps.api.main:app -w $${API_WORKERS:-2}
      -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
      --timeout 120 --graceful-timeout 30'
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prod
    env_file: ../../.env.prod
    depends_on: [postgres, redis, minio]
    command: sh -c 'celery -A apps.api.tasks.celery_app worker -Q transcoding -c $${TRANSCODING_CONCURRENCY:-1} --loglevel=warning'
    restart: unless-stopped

  email_worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prod
    env_file: ../../.env.prod
    depends_on: [redis]
    command: sh -c 'celery -A apps.api.tasks.celery_app worker -Q email_high,email_low -c $${EMAIL_CONCURRENCY:-1} --loglevel=warning'
    restart: unless-stopped

  maintenance_worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prod
    env_file: ../../.env.prod
    depends_on: [postgres, redis, minio]
    command: sh -c 'celery -A apps.api.tasks.celery_app worker -Q maintenance -c $${MAINTENANCE_CONCURRENCY:-1} --loglevel=warning'
    restart: unless-stopped

  beat:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prod
    env_file: ../../.env.prod
    depends_on: [redis]
    command: sh -c 'celery -A apps.api.tasks.celery_app beat --loglevel=warning -s /tmp/celerybeat-schedule'
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_UPLOAD_CONCURRENCY: ${NEXT_PUBLIC_UPLOAD_CONCURRENCY:-3}
        NEXT_PUBLIC_STUDIO_SSO_ENABLED: ${STUDIO_SSO_ENABLED:-false}
        NEXT_PUBLIC_STUDIO_TICKET_URL: https://app.elasticlabs.site/api/reviews/sso-ticket
    env_file: ../../.env.prod
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
